<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OBSTIME</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101117;
      color: #f5f7ff;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
    button, input, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      background: #41465c;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
    }
    button:hover {
      background: #646c89;
    }
    button.primary {
      background: #705ddb;
    }
    input, select {
      width: 100%;
      min-width: 0;
      background: #11131a;
      color: white;
      border: 1px solid #484e64;
      border-radius: 5px;
      padding: 7px;
    }
    input[type=checkbox] {
      width: auto;
    }
    input[type=file] {
      font-size: 12px;
    }
    input[type=color] {
      height: 36px;
      padding: 3px;
    }
    .app {
      display: grid;
      grid-template-columns: 370px 1fr;
      height: 100vh;
    }
    aside {
      overflow: auto;
      padding: 16px;
      background: #191c27;
    }
    h1 {
      font-size: 21px;
      margin: 0 0 8px;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    section {
      padding: 13px;
      background: #242837;
      border: 1px solid #353b50;
      border-radius: 10px;
      margin: 12px 0;
    }
    .row {
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      font-size: 13px;
    }
    .buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .note {
      font-size: 12px;
      color: #b8c0d7;
      line-height: 1.7;
    }
    .layer {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #454c64;
      padding: 7px;
      margin: 6px 0;
      border-radius: 6px;
      cursor: pointer;
    }
    .layer.active {
      border-color: #aa99ff;
      background: #383052;
    }
    .layer .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }
    .layer button {
      padding: 5px 7px;
    }
    .stage {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      background: #191c27;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .viewport {
      flex: 1;
      overflow: auto;
      padding: 30px;
      background-color: #303340;
      background-image: linear-gradient(45deg, #242631 25%, transparent 25%),
                        linear-gradient(-45deg, #242631 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #242631 75%),
                        linear-gradient(-45deg, transparent 75%, #242631 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }
    #frame {
      position: relative;
      margin: auto;
    }
    #canvas {
      position: relative;
      overflow: hidden;
      transform-origin: top left;
      box-shadow: 0 0 0 1px #9096a5;
    }
    .item {
      position: absolute;
      white-space: pre;
      line-height: 1.15;
      touch-action: none;
      user-select: none;
      cursor: move;
    }
    .item.selected {
      outline: 2px solid #b8a6ff;
      outline-offset: 2px;
    }
    .item img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .handle {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 12px;
      height: 12px;
      background: #baadff;
      border: 1px solid #222;
      cursor: nwse-resize;
      z-index: 1;
    }
    #status {
      min-height: 20px;
      color: #cec4ff;
      font-size: 12px;
    }
    #editSection[hidden] {
      display: none;
    }
    @media(max-width:800px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
      }
      aside {
        overflow: visible;
      }
      .stage {
        min-height: 500px;
      }
      .viewport {
        min-height: 420px;
      }
    }
    .copyright {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      background: #191c27;
      color: #aeb4c7;
      font-size: 11px;
      z-index: 100;
      white-space: nowrap;
    }
    .app {
      height: calc(100vh - 28px);
    }
    body {
      padding-bottom: 28px;
    }
    @media(max-width:800px) {
      .app {
        height: auto;
      }
    }
    details {
      margin-top: 12px;
      border-top: 1px solid #454c64;
      padding-top: 10px;
    }
    summary {
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 0;
    }
    details[open] > summary {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>OBS 時鐘製作器</h1>
      <section>
        <h2>畫布設定</h2>
        <div class="row">
          <label for="canvasW">寬度 px</label>
          <input id="canvasW" type="number" min="1" max="16384" value="700">
        </div>
        <div class="row">
          <label for="canvasH">高度 px</label>
          <input id="canvasH" type="number" min="1" max="16384" value="300">
        </div>
        <div class="row">
          <label>背景</label>
          <select id="bgMode">
            <option value="transparent">透明</option>
            <option value="color">純色</option>
          </select>
        </div>
        <div class="row">
          <label>背景顏色</label>
          <input id="bgColor" type="color" value="#000000">
        </div>
      </section>

      <section>
        <h2>插入圖片</h2>
        <input id="images" type="file" multiple accept="image/*,.gif,.apng">
      </section>

      <section>
        <h2>新增時間插件</h2>
        <div class="buttons">
          <button data-add="time">＋ 時間</button>
          <button data-add="date">＋ 日期</button>
          <button data-add="weekday">＋ 星期</button>
          <button data-add="dash">＋ 虛線</button>
          <button data-add="solid">＋ 實線</button>
          <button data-add="slash">＋ ／</button>
          <button data-add="text">＋ 自訂文字</button>
        </div>
      </section>

      <section>
        <h2>圖層上下排序</h2>
        <div id="layers"></div>
      </section>

      <div id="mappingPanel"></div>

      <section id="editSection" hidden>
        <h2 id="editTitle">修改時間插件</h2>
        <div id="editor"></div>
      </section>

      <section>
        <h2>匯出 OBS 時鐘</h2>
        <div class="buttons">
          <button id="zip" class="primary">匯出 ZIP</button>
          <button id="single" class="primary">匯出單一 HTML</button>
        </div>
      </section>
      
      <div id="status" role="status"></div>
    </aside>

    <main class="stage">
      <div class="toolbar">
        <button id="minus">－</button>
        <span id="zoomLabel">100%</span>
        <button id="plus">＋</button>
        <button id="fit">符合視窗</button>
      </div>
      <div class="viewport" id="viewport">
        <div id="frame">
          <div id="canvas"></div>
        </div>
      </div>
    </main>
  </div>

  <footer class="copyright">Copyright © 2026-2030 anshaer.com. All rights reserved.</footer>

  <script>
    'use strict';
    const $ = s => document.querySelector(s);
    const uid = () => 'l' + Math.random().toString(36).slice(2);
    const enc = new TextEncoder();

    let layers = [];
    let selected = null;
    let zoom = 1;
    let fonts = [];
    let drag = null;

    const customMaps = {
      useMonthMap: false,
      useWeekMap: false,
      monthMap: Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0')),
      weekMap: ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六']
    };

    const esc = s => String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('"', '&quot;')
      .replaceAll('<', '&lt;')
      .replaceAll("'", '&#39;');

    const num = (v, min, max, fallback) =>
      Number.isFinite(+v) && v !== '' ? Math.min(max, Math.max(min, +v)) : fallback;

    function formatDate(f, d, b = {}) {
      const pad = n => String(n).padStart(2, '0');
      const H = d.getHours();
      const h = H % 12 || 12;
      const m = {
        YYYY: d.getFullYear(),
        YY: String(d.getFullYear()).slice(-2),
        MM: pad(d.getMonth() + 1),
        M: d.getMonth() + 1,
        DD: pad(d.getDate()),
        D: d.getDate(),
        HH: pad(H),
        H,
        hh: pad(h),
        h,
        mm: pad(d.getMinutes()),
        m: d.getMinutes(),
        ss: pad(d.getSeconds()),
        s: d.getSeconds(),
        A: H < 12 ? 'AM' : 'PM',
        a: H < 12 ? 'am' : 'pm',
        ddd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()],
        wk: '星期' + ['日', '一', '二', '三', '四', '五', '六'][d.getDay()]
      };

      if (b.useMonthMap) {
        const v = b.monthMap?.[d.getMonth()];
        if (v !== undefined) {
          m.M = v;
          m.MM = v;
        }
      }
      if (b.useWeekMap) {
        const v = b.weekMap?.[d.getDay()];
        if (v !== undefined) {
          m.wk = v;
          m.ddd = v;
        }
      }
      return f.replace(/YYYY|YY|MM|DD|HH|hh|ddd|wk|M|D|H|h|mm|m|ss|s|A|a/g, k => m[k]);
    }

    function textOf(b) {
      if (['dash', 'solid', 'image'].includes(b.type)) return '';
      return ['time', 'date', 'weekday'].includes(b.type)
        ? formatDate(b.format, new Date(), customMaps)
        : b.text || '';
    }

    function settings() {
      return {
        w: num($('#canvasW').value, 1, 16384, 700),
        h: num($('#canvasH').value, 1, 16384, 300),
        bg: $('#bgMode').value === 'color' ? $('#bgColor').value : 'transparent'
      };
    }

    function canvasSize() {
      const s = settings();
      Object.assign($('#canvas').style, {
        width: s.w + 'px',
        height: s.h + 'px',
        background: s.bg,
        transform: `scale(${zoom})`
      });
      Object.assign($('#frame').style, {
        width: s.w * zoom + 'px',
        height: s.h * zoom + 'px'
      });
      $('#zoomLabel').textContent = Math.round(zoom * 100) + '%';
    }

    function styleItem(el, b, i) {
      Object.assign(el.style, {
        left: b.x + 'px',
        top: b.y + 'px',
        zIndex: String(layers.length - i),
        opacity: b.opacity,
        width: '',
        height: '',
        borderTop: '',
        fontSize: b.size + 'px',
        fontFamily: b.fontId ? b.fontId + ',sans-serif' : 'sans-serif',
        fontWeight: b.weight,
        color: b.color,
        textShadow: b.shadow ? '0 2px 5px rgba(0,0,0,.65)' : 'none'
      });

      if (b.type === 'image') {
        el.style.width = b.w + 'px';
        el.style.height = b.h + 'px';
      } else if (['dash', 'solid'].includes(b.type)) {
        el.style.width = b.w + 'px';
        el.style.height = Math.max(10, b.thickness) + 'px';
        el.style.borderTop = b.thickness + 'px ' + (b.type === 'dash' ? 'dashed' : 'solid') + ' ' + b.color;
      }
    }

    function render() {
      canvasSize();
      const c = $('#canvas');
      const ids = new Set(layers.map(b => b.id));

      [...c.children].forEach(e => {
        if (!ids.has(e.dataset.id)) e.remove();
      });

      layers.forEach((b, i) => {
        let e = document.getElementById(b.id);
        if (!e) {
          e = document.createElement('div');
          e.id = b.id;
          e.dataset.id = b.id;
          c.append(e);
          if (b.type === 'image') {
            const img = document.createElement('img');
            img.src = b.src;
            img.alt = b.name;
            img.draggable = false;
            e.append(img);
          } else {
            const t = document.createElement('span');
            t.className = 'value';
            e.append(t);
          }
        }
        e.className = 'item' + (b.id === selected ? ' selected' : '');
        styleItem(e, b, i);

        const t = e.querySelector('.value');
        if (t) t.textContent = textOf(b);

        let handle = e.querySelector('.handle');
        if (b.type === 'image' && b.id === selected) {
          if (!handle) {
            handle = document.createElement('div');
            handle.className = 'handle';
            e.append(handle);
          }
        } else if (handle) {
          handle.remove();
        }
      });
      renderList();
    }

    function renderList() {
      $('#layers').innerHTML = layers.map((b, i) =>
        `<div class="layer ${selected === b.id ? 'active' : ''}" draggable="true" data-id="${b.id}">` +
          `<span class="name">${b.type === 'image' ? '▧' : '◷'} ${esc(b.name)}</span>` +
          `<button data-move="-1" ${i === 0 ? 'disabled' : ''} title="往前一層">↑</button>` +
          `<button data-move="1" ${i === layers.length - 1 ? 'disabled' : ''} title="往後一層">↓</button>` +
          `<button data-delete="1" title="刪除此圖層">×</button>` +
        `</div>`
      ).join('') || '<div class="note">尚無圖層</div>';
    }

    function row(label, html) {
      return `<div class="row"><label>${label}</label>${html}</div>`;
    }

    function field(label, key, value, type = 'number', extra = '') {
      return row(label, `<input data-key="${key}" type="${type}" value="${esc(value)}" ${extra}>`);
    }

    function edit(id) {
      selected = id;
      const b = layers.find(b => b.id === id);
      $('#editSection').hidden = !b;
      if (!b) {
        render();
        return;
      }
      $('#editTitle').textContent = b.type === 'image' ? '修改圖片' : '修改時間插件';

      let h = field('圖層名稱', 'name', b.name, 'text') +
              field('X 位置 px', 'x', b.x) +
              field('Y 位置 px', 'y', b.y) +
              field('不透明度 %', 'opacity', Math.round(b.opacity * 100), 'number', 'min="0" max="100"');

      if (b.type === 'image') {
        h += field('寬度 px', 'w', b.w, 'number', 'min="1"') +
             field('高度 px', 'h', b.h, 'number', 'min="1"') +
             row('等比例縮放', `<input data-key="lock" type="checkbox" ${b.lock ? 'checked' : ''}>`);
      } else if (['dash', 'solid'].includes(b.type)) {
        h += field('線條寬度 px', 'w', b.w, 'number', 'min="1"') +
             field('線條粗細 px', 'thickness', b.thickness, 'number', 'min="1"') +
             field('線條顏色', 'color', b.color, 'color');
      } else {
        if (['time', 'date', 'weekday'].includes(b.type)) {
          h += field('時間格式', 'format', b.format, 'text');
        } else {
          h += field('顯示文字', 'text', b.text, 'text');
        }
        h += row('上傳字體', '<input id="fontUpload" type="file" accept=".ttf,.otf,.woff,.woff2">') +
             row('已上傳字體', `<select data-key="fontId"><option value="">未上傳（預設字體）</option>${fonts.map(f => `<option value="${f.id}" ${f.id === b.fontId ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>`) +
             field('字體大小 px', 'size', b.size, 'number', 'min="1"') +
             row('字體粗細', `<select data-key="weight">${[400, 600, 700, 900].map(w => `<option ${b.weight === w ? 'selected' : ''}>${w}</option>`).join('')}</select>`) +
             field('文字顏色', 'color', b.color, 'color') +
             row('文字陰影', `<input data-key="shadow" type="checkbox" ${b.shadow ? 'checked' : ''}>`);
      }

      $('#editor').innerHTML = h;
      const up = $('#fontUpload');
      if (up) up.onchange = e => uploadFont(e, b.id);
      render();
    }

    function add(type) {
      const defs = {
        time: ['時間', 'HH:mm:ss'],
        date: ['日期', 'YYYY.MM.DD'],
        weekday: ['星期', 'wk'],
        dash: ['虛線', ''],
        solid: ['實線', ''],
        slash: ['斜線', ''],
        text: ['自訂文字', '']
      };
      const [name, format] = defs[type];
      const s = settings();
      const b = {
        id: uid(),
        type,
        name,
        format,
        text: type === 'slash' ? '/' : type === 'text' ? '自訂文字' : '',
        x: Math.round(s.w * .15),
        y: Math.round(s.h * .25),
        opacity: 1,
        size: type === 'time' ? 52 : 25,
        weight: 700,
        color: '#ffffff',
        shadow: true,
        fontId: '',
        w: 260,
        thickness: 3
      };
      layers.unshift(b);
      edit(b.id);
    }

    $('#editor').addEventListener('input', e => {
      const key = e.target.dataset.key;
      const b = layers.find(b => b.id === selected);
      if (!key || !b) return;

      let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      if (['x', 'y', 'w', 'h', 'size', 'thickness', 'opacity', 'weight'].includes(key)) {
        if (v === '') return;
        v = num(
          v,
          ['w', 'h', 'size', 'thickness'].includes(key) ? 1 : key === 'opacity' ? 0 : -100000,
          key === 'opacity' ? 100 : 100000,
          b[key]
        );
        if (key === 'opacity') v /= 100;
      }
      if (b.type === 'image' && b.lock && ['w', 'h'].includes(key)) {
        const other = key === 'w' ? 'h' : 'w';
        b[other] = Math.max(1, Math.round(b[other] * v / b[key]));
        $('#editor [data-key=' + other + ']').value = b[other];
      }
      b[key] = v;
      render();
    });

    function fileData(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(Error('檔案讀取失敗'));
        r.readAsDataURL(file);
      });
    }

    async function uploadFont(e, id) {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const data = await fileData(f);
        const font = {
          id: uid(),
          name: f.name,
          src: data,
          ext: f.name.split('.').pop().toLowerCase()
        };
        const face = new FontFace(font.id, `url("${data}")`);
        await face.load();
        document.fonts.add(face);
        fonts.push(font);
        const b = layers.find(x => x.id === id);
        if (b) b.fontId = font.id;
        if (selected === id) edit(id);
        else render();
        status('字體已載入');
      } catch (err) {
        status('字體無法載入：' + err.message);
      }
    }

    function status(t) {
      $('#status').textContent = t;
    }

    $('#images').onchange = async e => {
      const files = [...e.target.files];
      e.target.value = '';
      for (const f of files) {
        try {
          if (!/^image\//.test(f.type) && !/\.(png|apng|gif|jpe?g|webp|avif|bmp|svg)$/i.test(f.name)) {
            throw Error('不支援的圖片格式');
          }
          let src = await fileData(f);
          if (/\.apng$/i.test(f.name)) {
            src = src.replace(/^data:[^;]*;/, 'data:image/png;');
          }
          const img = new Image();
          img.src = src;
          await new Promise((res, rej) => {
            img.onload = res;
            img.onerror = () => rej(Error('瀏覽器無法讀取圖片'));
          });
          const s = settings();
          const scale = Math.min(1, s.w / img.naturalWidth, s.h / img.naturalHeight);
          const b = {
            id: uid(),
            type: 'image',
            name: f.name,
            src,
            ext: f.name.split('.').pop().toLowerCase(),
            x: 0,
            y: 0,
            w: Math.max(1, Math.round(img.naturalWidth * scale)),
            h: Math.max(1, Math.round(img.naturalHeight * scale)),
            opacity: 1,
            lock: true
          };
          layers.unshift(b);
          edit(b.id);
          status('已插入 ' + f.name);
        } catch (err) {
          status(f.name + '：' + err.message);
        }
      }
    };

    document.addEventListener('click', e => {
      const type = e.target.dataset.add;
      if (type) add(type);
    });

    $('#layers').onclick = e => {
      const el = e.target.closest('.layer');
      if (!el) return;
      const id = el.dataset.id;
      const i = layers.findIndex(b => b.id === id);

      if (e.target.dataset.delete) {
        layers.splice(i, 1);
        edit(selected === id ? null : selected);
      } else if (e.target.dataset.move) {
        const j = i + Number(e.target.dataset.move);
        if (j >= 0 && j < layers.length) {
          [layers[i], layers[j]] = [layers[j], layers[i]];
        }
        render();
      } else {
        edit(id);
      }
    };

    let sortId = null;
    $('#layers').ondragstart = e => {
      sortId = e.target.closest('.layer')?.dataset.id;
      e.dataTransfer.setData('text/plain', sortId || '');
    };
    $('#layers').ondragover = e => e.preventDefault();
    $('#layers').ondrop = e => {
      e.preventDefault();
      const id = e.target.closest('.layer')?.dataset.id;
      if (!sortId || !id || id === sortId) return;
      const from = layers.findIndex(b => b.id === sortId);
      const to = layers.findIndex(b => b.id === id);
      if (from < 0) return;
      const [b] = layers.splice(from, 1);
      layers.splice(to, 0, b);
      sortId = null;
      render();
    };

    $('#canvas').onpointerdown = e => {
      if (e.button !== 0) return;
      const el = e.target.closest('.item');
      if (!el) {
        edit(null);
        return;
      }
      const b = layers.find(b => b.id === el.dataset.id);
      const resize = e.target.classList.contains('handle');
      edit(b.id);
      drag = {
        id: b.id,
        px: e.clientX,
        py: e.clientY,
        x: b.x,
        y: b.y,
        w: b.w,
        h: b.h,
        resize
      };
      $('#canvas').setPointerCapture(e.pointerId);
      e.preventDefault();
    };

    $('#canvas').onpointermove = e => {
      if (!drag) return;
      const b = layers.find(b => b.id === drag.id);
      if (!b) return;

      const dx = (e.clientX - drag.px) / zoom;
      const dy = (e.clientY - drag.py) / zoom;

      if (drag.resize) {
        b.w = Math.max(1, Math.round(drag.w + dx));
        b.h = b.lock ? Math.max(1, Math.round(drag.h * b.w / drag.w)) : Math.max(1, Math.round(drag.h + dy));
      } else {
        b.x = Math.round(drag.x + dx);
        b.y = Math.round(drag.y + dy);
      }

      styleItem(document.getElementById(b.id), b, layers.indexOf(b));
      ['x', 'y', 'w', 'h'].forEach(k => {
        const input = $('#editor [data-key=' + k + ']');
        if (input) input.value = b[k];
      });
    };

    $('#canvas').onpointerup = $('#canvas').onpointercancel = () => { drag = null; };
    $('#canvas').onlostpointercapture = () => { drag = null; };

    ['canvasW', 'canvasH', 'bgMode', 'bgColor'].forEach(id => {
      $('#' + id).oninput = canvasSize;
    });

    function setZoom(z) {
      zoom = Math.max(.1, Math.min(3, z));
      canvasSize();
    }
    $('#plus').onclick = () => setZoom(zoom + .1);
    $('#minus').onclick = () => setZoom(zoom - .1);
    $('#fit').onclick = () => {
      const s = settings();
      setZoom(Math.min(($('#viewport').clientWidth - 60) / s.w, ($('#viewport').clientHeight - 60) / s.h, 1));
    };

    function runtime(S) {
      const c = document.getElementById('clock');
      Object.assign(c.style, {
        width: S.w + 'px',
        height: S.h + 'px',
        background: S.bg
      });

      const timed = [];
      S.layers.forEach((b, i) => {
        const e = document.createElement('div');
        e.className = 'item';
        Object.assign(e.style, {
          left: b.x + 'px',
          top: b.y + 'px',
          opacity: b.opacity,
          zIndex: String(S.layers.length - i)
        });

        if (b.type === 'image') {
          Object.assign(e.style, {
            width: b.w + 'px',
            height: b.h + 'px'
          });
          const img = document.createElement('img');
          img.src = b.src;
          img.alt = '';
          e.append(img);
        } else if (['dash', 'solid'].includes(b.type)) {
          e.style.width = b.w + 'px';
          e.style.borderTop = b.thickness + 'px ' + (b.type === 'dash' ? 'dashed' : 'solid') + ' ' + b.color;
        } else {
          Object.assign(e.style, {
            fontSize: b.size + 'px',
            fontWeight: b.weight,
            color: b.color,
            fontFamily: b.fontId ? b.fontId + ',sans-serif' : 'sans-serif',
            textShadow: b.shadow ? '0 2px 5px rgba(0,0,0,.65)' : 'none'
          });
          if (['time', 'date', 'weekday'].includes(b.type)) {
            timed.push([e, b.format, b]);
          } else {
            e.textContent = b.text;
          }
        }
        c.append(e);
      });

      function tick() {
        const d = new Date();
        timed.forEach(([e, f, b]) => {
          const t = formatDate(f, d, S.customMaps);
          if (e.textContent !== t) e.textContent = t;
        });
      }

      tick();
      setInterval(tick, 200);

      const draw = makeImageAnimator();
      const start = Date.now();

      function frame() {
        S.layers.forEach((b, i) => {
          if (b.type === 'image') draw(c.children[i], b, Date.now(), start);
        });
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function build(split) {
      const s = {
        ...settings(),
        customMaps: JSON.parse(JSON.stringify(customMaps)),
        layers: JSON.parse(JSON.stringify(layers))
      };
      const files = [];
      const used = fonts.filter(f => s.layers.some(b => b.fontId === f.id));

      if (split) {
        s.layers.filter(b => b.type === 'image').forEach((b, i) => {
          const path = 'images/image_' + (i + 1) + '.' + (/^[a-z0-9]+$/.test(b.ext) ? b.ext : 'png');
          files.push([path, decodeData(b.src)]);
          b.src = path;
          if (b.fx) {
            b.fx.images.forEach((im, j) => {
              const name = 'images/image_' + (i + 1) + '_swap_' + (j + 1) + '.' + (/^[a-z0-9]+$/.test(im.ext) ? im.ext : 'png');
              files.push([name, decodeData(im.src)]);
              im.src = name;
            });
          }
        });
      }

      let css = '*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#clock{position:relative;overflow:hidden}.item{position:absolute;white-space:pre;line-height:1.15}.item img{width:100%;height:100%;display:block}';
      used.forEach((f, i) => {
        let src = f.src;
        if (split) {
          src = 'fonts/font_' + (i + 1) + '.' + f.ext;
          files.push([src, decodeData(f.src)]);
        }
        css += `@font-face{font-family:${f.id};src:url("${src}");font-display:block;}`;
      });

      const js = [imageDefaults, phaseSeconds, imagePose, makeImageAnimator].map(f => f.toString()).join('\n') +
        '\n' + formatDate.toString() +
        '\n(' + runtime.toString() + ')(' + JSON.stringify(s).replaceAll('<', '\\u003c') + ');';

      const html = '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS 時鐘</title>' +
        (split ? '<link rel="stylesheet" href="style.css">' : '<style>' + css + '</style>') +
        '</head><body><div id="clock"></div>' +
        (split ? '<script src="clock.js"><\/script>' : '<script>' + js + '<\/script>') +
        '</body></html>';

      if (split) {
        files.unshift(
          ['index.html', enc.encode(html)],
          ['style.css', enc.encode(css)],
          ['clock.js', enc.encode(js)]
        );
      }
      return { html, files };
    }

    function decodeData(src) {
      const raw = atob(src.slice(src.indexOf(',') + 1));
      return Uint8Array.from(raw, c => c.charCodeAt(0));
    }

    const crcTable = Array.from({ length: 256 }, (_, n) => {
      for (let k = 0; k < 8; k++) {
        n = n & 1 ? 0xedb88320 ^ (n >>> 1) : n >>> 1;
      }
      return n >>> 0;
    });

    function crc32(data) {
      let c = 0xffffffff;
      for (const n of data) {
        c = crcTable[(c ^ n) & 255] ^ (c >>> 8);
      }
      return (c ^ 0xffffffff) >>> 0;
    }

    function zipBytes(files) {
      let offset = 0;
      const local = [];
      const central = [];

      for (const [path, data] of files) {
        const name = enc.encode(path);
        const crc = crc32(data);
        const h = new Uint8Array(30 + name.length);
        const v = new DataView(h.buffer);

        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0x800, true);
        v.setUint16(12, 33, true);
        v.setUint32(14, crc, true);
        v.setUint32(18, data.length, true);
        v.setUint32(22, data.length, true);
        v.setUint16(26, name.length, true);
        h.set(name, 30);
        local.push(h, data);

        const ch = new Uint8Array(46 + name.length);
        const cv = new DataView(ch.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x800, true);
        cv.setUint16(14, 33, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, data.length, true);
        cv.setUint32(24, data.length, true);
        cv.setUint16(28, name.length, true);
        cv.setUint32(42, offset, true);
        ch.set(name, 46);
        central.push(ch);

        offset += h.length + data.length;
      }

      const end = new Uint8Array(22);
      const ev = new DataView(end.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, files.length, true);
      ev.setUint16(10, files.length, true);
      ev.setUint32(12, central.reduce((n, b) => n + b.length, 0), true);
      ev.setUint32(16, offset, true);

      return new Blob([...local, ...central, end], { type: 'application/zip' });
    }

    function download(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

    function exportClock(split) {
      try {
        const out = build(split);
        download(
          split ? zipBytes(out.files) : new Blob([out.html], { type: 'text/html;charset=utf-8' }),
          split ? 'OBS時鐘.zip' : 'OBS時鐘.html'
        );
        status('已匯出；OBS 來源尺寸：' + settings().w + ' × ' + settings().h);
      } catch (err) {
        status('匯出失敗：' + err.message);
      }
    }

    $('#zip').onclick = () => exportClock(true);
    $('#single').onclick = () => exportClock(false);

    function imageDefaults(b) {
      if (!b.fx) {
        b.fx = {
          swap: false,
          swapInterval: 5,
          swapDuration: 1,
          swapMode: 'fade',
          swapReset: 'none',
          rotate: false,
          rotateInterval: 0,
          rotateSpeed: 30,
          rotateDirection: 1,
          rotateReset: 'none',
          move: false,
          moveInterval: 3,
          moveSpeed: 100,
          moveMode: 'elastic',
          moveReset: 'none',
          angle: 0,
          fit: 'contain',
          positions: [],
          images: []
        };
      }
      return b.fx;
    }

    function phaseSeconds(mode, now, start) {
      const d = new Date(now);
      if (mode === 'minute') d.setSeconds(0, 0);
      else if (mode === 'half') d.setMinutes(Math.floor(d.getMinutes() / 30) * 30, 0, 0);
      else if (mode === 'hour') d.setMinutes(0, 0, 0);
      else if (mode === 'midnight') d.setHours(0, 0, 0, 0);
      else if (mode === 'noon') {
        d.setHours(12, 0, 0, 0);
        if (+d > now) d.setDate(d.getDate() - 1);
      } else return Math.max(0, (now - start) / 1000);
      return Math.max(0, (now - +d) / 1000);
    }

    function imagePose(b, now, start) {
      const f = imageDefaults(b);
      const pose = { x: b.x, y: b.y, angle: f.angle, index: 0, previous: 0, mix: 1 };
      const count = 1 + f.images.length;

      if (f.swap && count > 1) {
        const t = phaseSeconds(f.swapReset, now, start);
        const hold = Math.max(.1, f.swapInterval);
        const dur = f.swapMode === 'cut' ? 0 : Math.max(.05, f.swapDuration);
        const period = hold + dur;
        const k = Math.floor(t / period);
        const p = t % period;
        pose.index = k % count;
        pose.previous = pose.index;
        if (p >= hold && dur) {
          pose.previous = pose.index;
          pose.index = (k + 1) % count;
          pose.mix = (p - hold) / dur;
        }
      }

      if (f.rotate) {
        const t = phaseSeconds(f.rotateReset, now, start);
        const duration = 360 / Math.max(1, f.rotateSpeed);
        const period = duration + Math.max(0, f.rotateInterval);
        pose.angle += Math.min(t % period, duration) * f.rotateSpeed * f.rotateDirection;
      }

      if (f.move && f.positions.length) {
        const points = [{ x: b.x, y: b.y }, ...f.positions];
        const segments = points.map((p, i) => {
          const q = points[(i + 1) % points.length];
          return {
            p,
            q,
            d: f.moveMode === 'cut' ? 0 : Math.hypot(q.x - p.x, q.y - p.y) / Math.max(1, f.moveSpeed)
          };
        });
        const hold = Math.max(.1, f.moveInterval);
        const total = segments.reduce((a, s) => a + hold + s.d, 0);
        let t = phaseSeconds(f.moveReset, now, start) % total;

        for (const s of segments) {
          if (t < hold + s.d) {
            let k = t < hold ? 0 : s.d ? (t - hold) / s.d : 1;
            if (f.moveMode === 'elastic' && k > 0 && k < 1) {
              k = Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * 2 * Math.PI / 3) + 1;
            }
            pose.x = s.p.x + (s.q.x - s.p.x) * k;
            pose.y = s.p.y + (s.q.y - s.p.y) * k;
            break;
          }
          t -= hold + s.d;
        }
      }
      return pose;
    }

    function makeImageAnimator() {
      const cache = new WeakMap();
      return function (e, b, now, start, enabled = true) {
        const f = imageDefaults(b);
        let state = cache.get(e);
        const sources = [b.src, ...f.images.map(i => i.src)];

        if (!state || state.sources.length !== sources.length || state.sources.some((v, i) => v !== sources[i])) {
          e.querySelectorAll('img,.fx-rotor').forEach(n => n.remove());
          const rotor = document.createElement('div');
          Object.assign(rotor.style, {
            position: 'absolute',
            inset: '0',
            pointerEvents: 'none'
          });

          const imgs = sources.map(src => {
            const img = document.createElement('img');
            img.src = src;
            img.draggable = false;
            Object.assign(img.style, {
              position: 'absolute',
              inset: '0',
              width: '100%',
              height: '100%',
              pointerEvents: 'none'
            });
            rotor.append(img);
            return img;
          });

          rotor.className = 'fx-rotor';
          e.prepend(rotor);
          state = { sources, rotor, imgs };
          cache.set(e, state);
        }

        const p = enabled ? imagePose(b, now, start) : { x: b.x, y: b.y, angle: f.angle, index: 0, previous: 0, mix: 1 };
        e.style.left = p.x + 'px';
        e.style.top = p.y + 'px';
        state.rotor.style.transform = `rotate(${p.angle}deg)`;

        state.imgs.forEach((img, i) => {
          let opacity = 0;
          let scale = 1;
          if (p.index === p.previous) {
            opacity = i === p.index ? 1 : 0;
          } else if (f.swapMode === 'zoom') {
            if (i === p.previous) {
              opacity = p.mix < .5 ? 1 : 0;
              scale = Math.max(0, 1 - p.mix * 2);
            }
            if (i === p.index) {
              opacity = p.mix >= .5 ? 1 : 0;
              scale = Math.max(0, p.mix * 2 - 1);
            }
          } else {
            if (i === p.previous) opacity = 1 - p.mix;
            if (i === p.index) opacity = p.mix;
          }
          img.style.opacity = opacity;
          img.style.transform = `scale(${scale})`;
          img.style.objectFit = 'contain';
        });
      };
    }

    let fxPreview = false;
    let fxStart = Date.now();
    const animateImage = makeImageAnimator();

    function fxRow(label, key, value, type = 'number', extra = '') {
      return row(label, `<input data-fx="${key}" type="${type}" ${type === 'checkbox' ? (value ? 'checked' : '') : `value="${esc(value)}"`} ${extra}>`);
    }

    function fxSelect(label, key, value, options) {
      return row(label, `<select data-fx="${key}">${options.map(([v, n]) => `<option value="${v}" ${v === value ? 'selected' : ''}>${n}</option>`).join('')}</select>`);
    }

    function resetSelect(key, value) {
      return fxSelect('歸零重整', key, value, [
        ['none', '不定時（載入起算）'],
        ['hour', '整點（每小時）'],
        ['midnight', '0 時（每日）'],
        ['noon', '12 時（每日中午）'],
        ['minute', '每分'],
        ['half', '30 分（每小時 00 / 30）']
      ]);
    }

    const foldStates = new Map();
    const oldEdit = edit;

    edit = function (id) {
      oldEdit(id);
      const b = layers.find(b => b.id === id);
      if (!b || b.type !== 'image') return;

      const f = imageDefaults(b);
      const box = document.createElement('div');
      box.id = 'fxEditor';
      box.innerHTML = `<details data-fold="swap"><summary>替換圖片</summary>` +
        fxRow('啟用輪播', 'swap', f.swap, 'checkbox') +
        row('替換圖片（多選）', '<input id="swapFiles" type="file" multiple accept="image/*,.apng,.gif">') +
        '<div>' + f.images.map((im, i) => `<div class="buttons" style="margin:6px 0"><span class="note">${i + 2}. ${esc(im.name)}</span><button data-fx-up="${i}">↑</button><button data-fx-remove="${i}">刪除</button></div>`).join('') + '</div>' +
        fxRow('替換間隔 秒', 'swapInterval', f.swapInterval, 'number', 'min="0.1" step="0.1"') +
        fxSelect('替換模式', 'swapMode', f.swapMode, [['fade', '淡入淡出'], ['cut', '直換'], ['zoom', '縮小放大']]) +
        fxRow('過場時間 秒', 'swapDuration', f.swapDuration, 'number', 'min="0.05" step="0.05"') +
        resetSelect('swapReset', f.swapReset) +
        `</details><details data-fold="rotate"><summary>圖片旋轉</summary>` +
        fxRow('起始角度 °', 'angle', f.angle) +
        fxRow('持續旋轉', 'rotate', f.rotate, 'checkbox') +
        fxRow('旋轉間隔 秒', 'rotateInterval', f.rotateInterval, 'number', 'min="0" step="0.1"') +
        fxRow('旋轉速度 °/秒', 'rotateSpeed', f.rotateSpeed, 'number', 'min="1"') +
        fxSelect('旋轉方向', 'rotateDirection', String(f.rotateDirection), [['1', '順時針'], ['-1', '逆時針']]) +
        resetSelect('rotateReset', f.rotateReset) +
        `</details><details data-fold="move"><summary>位置移動</summary>` +
        fxRow('啟用位置移動', 'move', f.move, 'checkbox') +
        fxRow('移動間隔 秒', 'moveInterval', f.moveInterval, 'number', 'min="0.1" step="0.1"') +
        fxRow('移動速度 px/秒', 'moveSpeed', f.moveSpeed, 'number', 'min="1"') +
        fxSelect('移動模式', 'moveMode', f.moveMode, [['elastic', '彈性移動'], ['cut', '直換位置']]) +
        resetSelect('moveReset', f.moveReset) +
        Array.from({ length: 20 }, (_, i) => {
          const p = f.positions[i];
          return `<div style="border-top:1px solid #454c64;padding:6px 0">` +
            `<div class="note">位置 ${i + 1}${p ? '' : '（未設定）'}</div>` +
            (p ? `<div class="buttons"><input style="width:90px" type="number" data-pos="${i}" data-axis="x" value="${p.x}" aria-label="位置 ${i + 1} X"><input style="width:90px" type="number" data-pos="${i}" data-axis="y" value="${p.y}" aria-label="位置 ${i + 1} Y"></div>` : '') +
            `<div class="buttons"><button data-record="${i}">記錄目前位置</button>${p ? `<button data-go="${i}">套用位置</button><button data-pos-remove="${i}">刪除</button>` : ''}</div>` +
            `</div>`;
        }).join('') +
        `</details>`;

      $('#editor').append(box);
      box.querySelectorAll('details').forEach(d => {
        const key = id + ':' + d.dataset.fold;
        d.open = foldStates.get(key) ?? false;
        d.addEventListener('toggle', () => foldStates.set(key, d.open));
      });

      $('#swapFiles').onchange = async ev => {
        for (const file of ev.target.files) {
          try {
            let src = await fileData(file);
            if (/\.apng$/i.test(file.name)) {
              src = src.replace(/^data:[^;]*;/, 'data:image/png;');
            }
            const img = new Image();
            await new Promise((res, rej) => {
              img.onload = res;
              img.onerror = () => rej(Error('圖片無法讀取'));
              img.src = src;
            });
            f.images.push({ name: file.name, src, ext: file.name.split('.').pop().toLowerCase() });
          } catch (err) {
            status(file.name + '：' + err.message);
          }
        }
        if (selected === id) edit(id);
      };
    };

    $('#editor').addEventListener('input', e => {
      const b = layers.find(b => b.id === selected);
      if (!b || b.type !== 'image') return;
      const f = imageDefaults(b);
      const key = e.target.dataset.fx;

      if (key) {
        let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
        if (e.target.type === 'number' || key === 'rotateDirection') {
          if (v === '' || !Number.isFinite(+v)) return;
          v = +v;
          const min = { swapInterval: .1, swapDuration: .05, rotateInterval: 0, rotateSpeed: 1, moveInterval: .1, moveSpeed: 1 };
          if (min[key] !== undefined) v = Math.max(min[key], v);
        }
        f[key] = v;
        fxStart = Date.now();
      }

      if (e.target.dataset.pos !== undefined) {
        const p = f.positions[+e.target.dataset.pos];
        if (p && e.target.value !== '' && Number.isFinite(+e.target.value)) {
          p[e.target.dataset.axis] = +e.target.value;
        }
      }
    });

    $('#editor').addEventListener('click', e => {
      const b = layers.find(b => b.id === selected);
      if (!b || b.type !== 'image') return;
      const f = imageDefaults(b);
      const d = e.target.dataset;
      let changed = true;

      if (d.record !== undefined) {
        const i = +d.record;
        if (i > f.positions.length) {
          status('請依序記錄位置，先填入位置 ' + (f.positions.length + 1));
          return;
        }
        f.positions[i] = { x: b.x, y: b.y };
      } else if (d.go !== undefined) {
        const p = f.positions[+d.go];
        b.x = p.x;
        b.y = p.y;
        fxPreview = false;
        previewButton.textContent = '播放效果預覽';
      } else if (d.posRemove !== undefined) {
        f.positions.splice(+d.posRemove, 1);
      } else if (d.fxRemove !== undefined) {
        f.images.splice(+d.fxRemove, 1);
      } else if (d.fxUp !== undefined) {
        const i = +d.fxUp;
        if (i > 0) [f.images[i], f.images[i - 1]] = [f.images[i - 1], f.images[i]];
      } else {
        changed = false;
      }

      if (changed) {
        fxStart = Date.now();
        edit(b.id);
      }
    });

    const previewButton = document.createElement('button');
    previewButton.textContent = '播放效果預覽';
    previewButton.onclick = () => {
      fxPreview = !fxPreview;
      previewButton.textContent = fxPreview ? '停止效果預覽' : '播放效果預覽';
      fxStart = Date.now();
    };
    $('.toolbar').append(previewButton);

    const restart = document.createElement('button');
    restart.textContent = '重新對時／預覽';
    restart.onclick = () => {
      fxStart = Date.now();
      status('已重新對時');
    };
    $('.toolbar').append(restart);

    function fxFrame() {
      const now = Date.now();
      layers.filter(b => b.type === 'image').forEach(b => {
        const e = document.getElementById(b.id);
        if (e) animateImage(e, b, now, fxStart, fxPreview && !(drag && drag.id === b.id));
      });
      requestAnimationFrame(fxFrame);
    }
    requestAnimationFrame(fxFrame);

    const originalDown = $('#canvas').onpointerdown;
    $('#canvas').onpointerdown = e => {
      if (e.target.closest('.item')) {
        fxPreview = false;
        previewButton.textContent = '播放效果預覽';
      }
      originalDown(e);
    };

    function mappingEditor(b) {
      if (!b.monthMap) b.monthMap = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0'));
      if (!b.weekMap) b.weekMap = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

      return '<section><details><summary>月份自訂對照表</summary>' +
        row('套用月份對照', `<input type="checkbox" data-map-enable="useMonthMap" ${b.useMonthMap ? 'checked' : ''}>`) +
        b.monthMap.map((v, i) => row((i + 1) + ' 月', `<input type="text" data-map="monthMap" data-index="${i}" value="${esc(v)}">`)).join('') +
        '</details></section>' +
        '<section><details><summary>星期自訂對照表</summary>' +
        row('套用星期對照', `<input type="checkbox" data-map-enable="useWeekMap" ${b.useWeekMap ? 'checked' : ''}>`) +
        b.weekMap.map((v, i) => row('星期' + ['日', '一', '二', '三', '四', '五', '六'][i], `<input type="text" data-map="weekMap" data-index="${i}" value="${esc(v)}">`)).join('') +
        '</details></section>';
    }

    $('#mappingPanel').innerHTML = mappingEditor(customMaps);
    $('#mappingPanel').addEventListener('input', e => {
      const k = e.target.dataset.map;
      const en = e.target.dataset.mapEnable;
      if (k) {
        customMaps[k][Number(e.target.dataset.index)] = e.target.value;
        const flag = k === 'monthMap' ? 'useMonthMap' : 'useWeekMap';
        customMaps[flag] = true;
        $('#mappingPanel [data-map-enable="' + flag + '"]').checked = true;
        render();
      } else if (en) {
        customMaps[en] = e.target.checked;
        render();
      }
    });

    add('time');
    setInterval(() => {
      layers.filter(b => ['time', 'date', 'weekday'].includes(b.type)).forEach(b => {
        const e = document.getElementById(b.id)?.querySelector('.value');
        const t = textOf(b);
        if (e && e.textContent !== t) e.textContent = t;
      });
    }, 200);
  </script>
</body>
</html>
